name: Publish Dalamud repository release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download current Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore, test, and build
        shell: pwsh
        run: |
          dotnet restore SmartUndercutBot.sln
          if ($LASTEXITCODE -ne 0) { throw "Dependency restore failed." }
          dotnet test tests/SmartUndercutBot.Core.Tests/SmartUndercutBot.Core.Tests.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Tests failed; release cancelled." }
          dotnet build src/SmartUndercutBot/SmartUndercutBot.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Plugin build failed; release cancelled." }

      - name: Create plugin ZIP and repository JSON
        shell: pwsh
        run: |
          $manifestFile = Get-ChildItem -Path "src\SmartUndercutBot\bin" -Recurse -Filter "SmartUndercutBot.json" |
            Where-Object {
              $json = Get-Content -Raw -LiteralPath $_.FullName | ConvertFrom-Json
              $json.InternalName -eq "SmartUndercutBot" -and $json.AssemblyVersion -and $json.DalamudApiLevel
            } |
            Select-Object -First 1
          if (-not $manifestFile) {
            throw "Could not locate the DalamudPackager output manifest."
          }
          $output = $manifestFile.DirectoryName
          $manifestPath = $manifestFile.FullName

          $artifacts = Join-Path $PWD "release-artifacts"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          Compress-Archive -Path (Join-Path $output "*") -DestinationPath (Join-Path $artifacts "SmartUndercutBot.zip") -Force

          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if (-not $manifest.InternalName -or -not $manifest.AssemblyVersion -or -not $manifest.DalamudApiLevel) {
            throw "DalamudPackager did not add InternalName, AssemblyVersion, or DalamudApiLevel to the manifest."
          }
          if ("v$($manifest.AssemblyVersion)" -ne $env:GITHUB_REF_NAME) {
            throw "Release tag does not match the packaged plugin version."
          }

          $repositoryUrl = "https://github.com/Neycourt5/AutoUnderCut"
          $downloadUrl = "$repositoryUrl/releases/latest/download/SmartUndercutBot.zip"
          $manifest | Add-Member -NotePropertyName RepoUrl -NotePropertyValue $repositoryUrl -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkInstall -NotePropertyValue $downloadUrl -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkUpdate -NotePropertyValue $downloadUrl -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkTesting -NotePropertyValue $downloadUrl -Force
          $manifest | Add-Member -NotePropertyName TestingAssemblyVersion -NotePropertyValue $manifest.AssemblyVersion -Force
          $manifest | Add-Member -NotePropertyName TestingDalamudApiLevel -NotePropertyValue $manifest.DalamudApiLevel -Force
          $manifest | Add-Member -NotePropertyName LastUpdate -NotePropertyValue ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) -Force

          ConvertTo-Json -InputObject @($manifest) -Depth 20 |
            Set-Content -LiteralPath (Join-Path $artifacts "repo.json") -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "release-artifacts/SmartUndercutBot.zip"
          $repo = "release-artifacts/repo.json"
          gh release create $tag "$zip#SmartUndercutBot.zip" "$repo#repo.json" --title $tag --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed." }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartUndercutBot-${{ github.ref_name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
