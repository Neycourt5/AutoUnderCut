name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download current Dalamud development files
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Restore
        run: dotnet restore SmartUndercutBot.sln

      - name: Test pricing core
        run: dotnet test tests/SmartUndercutBot.Core.Tests/SmartUndercutBot.Core.Tests.csproj --configuration Release --no-restore

      - name: Build plugin
        run: dotnet build src/SmartUndercutBot/SmartUndercutBot.csproj --configuration Release --no-restore

      - name: Locate packaged plugin
        id: package
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path "src\SmartUndercutBot\bin" -Recurse -Filter "SmartUndercutBot.json" |
            Where-Object {
              $json = Get-Content -Raw -LiteralPath $_.FullName | ConvertFrom-Json
              $json.InternalName -eq "SmartUndercutBot" -and $json.AssemblyVersion -and $json.DalamudApiLevel
            } |
            Select-Object -First 1
          if (-not $manifest) {
            throw "Could not locate the DalamudPackager output manifest."
          }
          "plugin_output=$($manifest.DirectoryName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartUndercutBot
          path: ${{ steps.package.outputs.plugin_output }}/*
          if-no-files-found: error
          retention-days: 7
